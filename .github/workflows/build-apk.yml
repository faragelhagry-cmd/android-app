
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check that all program files were uploaded
        run: |
          ls -la
          for f in package.json capacitor.config.json patch_manifest.py www/index.html www/app.js; do
            if [ ! -f "$f" ]; then
              echo "::error::الملف $f مش موجود في الـ Repository"
              exit 1
            fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm install

      - name: Bundle offline PDF generator for Android
        run: cp node_modules/html2pdf.js/dist/html2pdf.bundle.min.js www/html2pdf.bundle.min.js

      - run: npx cap add android

      - name: Set Android versionCode and versionName
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          python3 - "$VERSION" "$VERSION_CODE" <<'PYCODE'
          from pathlib import Path
          import re, sys

          version, code = sys.argv[1], sys.argv[2]
          p = Path('android/app/build.gradle')
          s = p.read_text()

          s, n1 = re.subn(
              r'versionCode\s+\d+',
              'versionCode ' + code,
              s,
              count=1
          )
          s, n2 = re.subn(
              r"""versionName\s+['"]([^'"]*)['"]""",
              'versionName "' + version + '"',
              s,
              count=1
          )

          if n1 != 1 or n2 != 1:
              raise SystemExit('Could not set Android versionCode/versionName')

          p.write_text(s)
          print(f'Android versionName={version}, versionCode={code}')
          PYCODE

      - name: Patch Android project
        run: |
          python3 patch_manifest.py
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 23/' android/variables.gradle

      - name: Prepare showroom logo
        run: |
          test -s assets/icon-only.png
          cp assets/icon-only.png assets/icon.png

      - name: Generate Android launcher icons
        run: |
          npx --yes @capacitor/assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff'
          test -s android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Restore saved Android debug keystore
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          if [ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Missing ANDROID_DEBUG_KEYSTORE_BASE64 secret"
            exit 1
          fi
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          test -s "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey

      - run: npx cap sync android

      - name: Configure Gradle to use the saved debug key
        run: |
          python3 <<'PYCODE'
          from pathlib import Path
          import re

          p = Path('android/app/build.gradle')
          s = p.read_text()

          if 'signingConfigs' not in s:
              s, n = re.subn(
                  r'android\s*\{',
                  """android {
              signingConfigs {
                  debug {
                      storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          """,
                  s,
                  count=1
              )
              if n != 1:
                  raise SystemExit('Could not add signingConfigs')
          else:
              print('Existing signingConfigs detected; leaving them unchanged.')
              raise SystemExit('Review existing signingConfigs before building to avoid overriding signing settings.')

          s, n = re.subn(
              r'buildTypes\s*\{',
              """buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                  }
          """,
              s,
              count=1
          )
          if n != 1:
              raise SystemExit('Could not configure debug signing')

          p.write_text(s)
          PYCODE

      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Print APK signing certificate fingerprint
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK" | tee apk-signature.txt

      - name: Name the APK with the version number
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="$(node -p "require('./package.json').version")"
          fi
          cp android/app/build/outputs/apk/debug/app-debug.apk "Accounting-Android-${VER}.apk"
          echo "APK_NAME=Accounting-Android-${VER}.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: Accounting-Reader-APK
          path: ${{ env.APK_NAME }}

      - name: Publish a GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_NAME }}
          name: الإصدار ${{ github.ref_name }}
          body: تحديث تطبيق الموبايل — نزّل ملف الـ APK المرفق وثبّته فوق النسخة القديمة.
