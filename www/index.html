/* ===== كارت بيانات العميل بالشكل الجديد ===== */
.mcu{background:var(--card);border-radius:20px;padding:22px 18px 18px;box-shadow:0 8px 22px rgba(10,40,35,.08);display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:12px}
.mcu-av{width:58px;height:58px;border-radius:50%;color:#fff;font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;box-shadow:0 4px 10px rgba(0,0,0,.15)}
.mcu-n{font-size:18px}
.mcu-p{font-size:13px;color:var(--mut);margin-top:3px}
.mcu-act{display:flex;gap:6px;margin-top:16px;width:100%}
.mcu-act>button,.mcu-act>a{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;font:inherit;color:var(--tx);text-decoration:none;cursor:pointer;font-size:10.5px;font-weight:700;padding:0}
.mcu-act>button:disabled{opacity:.35;cursor:default}
.mcu-i{font-style:normal;width:44px;height:44px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:19px;line-height:1}
.mcu-i.i1{background:rgba(47,111,237,.12)}
.mcu-i.i2{background:rgba(124,58,237,.14)}
.mcu-i.i3{background:rgba(22,163,74,.14)}
.mcu-i.i4{background:rgba(14,107,92,.14)}
.mcu-bar{background:var(--card);border-radius:14px;padding:12px 16px;margin-bottom:8px;box-shadow:0 4px 12px rgba(10,40,35,.05)}
.mcu-bart{height:9px;border-radius:5px;background:var(--soft);overflow:hidden;margin-top:7px}
.mcu-bart i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#f59e0b,#16a34a)}

/* ===== عرض الجدول البديل للقوائم في تطبيق الموبايل ===== */
.mtbl{background:var(--card);border-radius:16px;box-shadow:0 6px 16px rgba(10,40,35,.07);overflow:auto;margin-top:4px}
.mtbl table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
.mtbl th{background:var(--soft);color:var(--pr);text-align:right;padding:10px 12px;font-weight:800;position:sticky;top:0}
.mtbl td{padding:10px 12px;border-top:1px solid var(--bd)}
.mtbl tr[onclick]{cursor:pointer}
.mtbl tbody tr:hover td{background:var(--soft)}
.mtbl tr.bad td:first-child{border-right:3px solid var(--bad)}
.mtbl tr.warn td:first-child{border-right:3px solid var(--warn)}
.mtop .btn.s{min-height:34px;padding:0 10px;font-size:12.5px}
::selection{background:color-mix(in srgb,var(--pr) 30%,transparent)}
</style>

<div id="ov"><div id="bx"><div id="bxh"><b id="bxt"></b><button class="wb" onclick="minWin()" title="تصغير">—</button><button class="wb mx" onclick="maxWin()" title="تكبير">⤢</button><button class="wb x" onclick="xClose()" title="إغلاق">✕</button></div><div id="box"></div></div></div>
<div id="ov2"><div id="bx2"><div id="bxh2"><span></span><button class="wb x" onclick="closeF2()" title="إغلاق">✕</button></div><div id="box2"></div></div></div><div id="toast"></div><div id="mins"></div>
<div id="pa"></div>
